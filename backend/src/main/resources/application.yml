spring:
  application:
    name: employee-leave-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leave_management}
    username: ${DB_USERNAME:leave_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
app:
  organization-time-zone: ${ORGANIZATION_TIME_ZONE:Asia/Kolkata}
  pagination:
    default-size: 20
    max-size: 100

