openapi: 3.1.0
info:
  title: Employee Leave Management API
  version: 0.1.0
  description: REST contract for the Employee Leave Management MVP. See authorization.md for row-level scope rules.
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: Authentication
  - name: Employee
  - name: Manager
  - name: Administration
  - name: Reference
paths:
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: CSRF token for unsafe requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated principal and newly established session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Session invalidated }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentPrincipal
      responses:
        '200':
          description: Current authenticated principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /leave-types:
    get:
      tags: [Reference]
      operationId: listAvailableLeaveTypes
      responses:
        '200':
          description: Active leave types and request options visible to current employee
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveTypeSummary' }
  /holidays:
    get:
      tags: [Reference]
      operationId: listCompanyHolidays
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Active company holidays in range
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Holiday' }

  /employee/dashboard:
    get:
      tags: [Employee]
      operationId: getEmployeeDashboard
      responses:
        '200':
          description: Current employee dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /employee/leave-balances:
    get:
      tags: [Employee]
      operationId: listOwnLeaveBalances
      responses:
        '200':
          description: Current employee balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveBalance' }
  /employee/leave-requests/calculate:
    post:
      tags: [Employee]
      operationId: calculateOwnLeaveRequest
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestInput' }
      responses:
        '200':
          description: Authoritative preview; does not reserve balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveCalculation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employee/leave-requests:
    get:
      tags: [Employee]
      operationId: listOwnLeaveRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Paginated own request history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestPage' }
    post:
      tags: [Employee]
      operationId: submitOwnLeaveRequest
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestInput' }
      responses:
        '201':
          description: Pending request created and balance reserved where required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employee/leave-requests/{requestId}:
    get:
      tags: [Employee]
      operationId: getOwnLeaveRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Own request detail and status history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employee/leave-requests/{requestId}/cancel:
    post:
      tags: [Employee]
      operationId: cancelOwnLeaveRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentCommand' }
      responses:
        '200':
          description: Request cancelled and balance released or restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDetail' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employee/team-calendar:
    get:
      tags: [Employee]
      operationId: getEmployeeTeamCalendar
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Pending/approved own entries and entries for active employees sharing the viewer's direct manager; privacy-safe fields only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmployeeTeamCalendarEntry' }

  /manager/leave-requests:
    get:
      tags: [Manager]
      operationId: listDirectReportLeaveRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Requests limited to current manager's direct reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /manager/leave-requests/{requestId}:
    get:
      tags: [Manager]
      operationId: getDirectReportLeaveRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Direct-report request with relevant balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerLeaveRequestDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /manager/leave-requests/{requestId}/approve:
    post:
      tags: [Manager]
      operationId: approveDirectReportLeaveRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionCommand' }
      responses:
        '200':
          description: Approved; reservation converted to consumption
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /manager/leave-requests/{requestId}/reject:
    post:
      tags: [Manager]
      operationId: rejectDirectReportLeaveRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionCommand' }
      responses:
        '200':
          description: Rejected; reservation released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /manager/team-calendar:
    get:
      tags: [Manager]
      operationId: getManagerTeamCalendar
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Pending and approved leave for direct reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagerCalendarEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/employees:
    get:
      tags: [Administration]
      operationId: listEmployees
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paginated employee records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      operationId: createEmployee
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreateCommand' }
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/employees/{employeeId}:
    patch:
      tags: [Administration]
      operationId: updateEmployee
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdateCommand' }
      responses:
        '200':
          description: Employee/reporting relationship updated or deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/leave-types:
    get:
      tags: [Administration]
      operationId: listAdminLeaveTypes
      responses:
        '200':
          description: All leave types and current policy versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveTypeDetail' }
    post:
      tags: [Administration]
      operationId: createLeaveType
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveTypeCreateCommand' }
      responses:
        '201':
          description: Leave type created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveTypeDetail' }
  /admin/leave-types/{leaveTypeId}:
    patch:
      tags: [Administration]
      operationId: updateLeaveType
      parameters:
        - $ref: '#/components/parameters/LeaveTypeId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveTypeUpdateCommand' }
      responses:
        '200':
          description: Leave type metadata updated or deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveTypeDetail' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/leave-types/{leaveTypeId}/policies:
    post:
      tags: [Administration]
      operationId: createLeavePolicyVersion
      parameters:
        - $ref: '#/components/parameters/LeaveTypeId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeavePolicyCommand' }
      responses:
        '201':
          description: Effective-dated policy version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeavePolicy' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/holidays:
    get:
      tags: [Administration]
      operationId: listAdminHolidays
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Holidays including inactive records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Holiday' }
    post:
      tags: [Administration]
      operationId: createHoliday
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayCreateCommand' }
      responses:
        '201':
          description: Holiday created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holiday' }
  /admin/holidays/{holidayId}:
    patch:
      tags: [Administration]
      operationId: updateHoliday
      parameters:
        - $ref: '#/components/parameters/HolidayId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayUpdateCommand' }
      responses:
        '200':
          description: Holiday updated or soft-deactivated; historical leave and audit data are retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Holiday' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/employees/{employeeId}/leave-balances:
    get:
      tags: [Administration]
      operationId: listEmployeeBalancesForAdmin
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Selected employee balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveBalance' }
    post:
      tags: [Administration]
      operationId: createEmployeeBalancePeriod
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BalanceAllocationCommand' }
      responses:
        '201':
          description: Employee leave balance period and starting allocation created (the sole MVP allowance mechanism)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveBalance' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/employees/{employeeId}/leave-balances/{balanceId}/adjustments:
    post:
      tags: [Administration]
      operationId: adjustEmployeeBalance
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/BalanceId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BalanceAdjustmentCommand' }
      responses:
        '200':
          description: Balance adjusted with audit record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveBalance' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/leave-requests:
    get:
      tags: [Administration]
      operationId: listOrganizationLeaveRequests
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Organization-wide paginated requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestPage' }
  /admin/leave-requests/{requestId}/corrections:
    post:
      tags: [Administration]
      operationId: correctLeaveRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionCommand' }
      responses:
        '200':
          description: One permitted correction action and its balance, occupancy, immutable history, and audit effects recorded atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestDetail' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/reports/leave-summary:
    get:
      tags: [Administration]
      operationId: getLeaveSummaryReport
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Totals by status and leave type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveSummaryReport' }
  /admin/audit-events:
    get:
      tags: [Administration]
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paginated immutable audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Status:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/LeaveStatus' }
    FromDate:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LeaveTypeId:
      name: leaveTypeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HolidayId:
      name: holidayId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BalanceId:
      name: balanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication required or login failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Role, ownership, or reporting scope denied
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource absent or hidden from current scope
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Overlap, balance, stale state, policy, or transition conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Business rule prevents the command
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName: { type: string, const: X-XSRF-TOKEN }
        token: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
    Principal:
      type: object
      required: [userId, employeeId, displayName, roles]
      properties:
        userId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        displayName: { type: string }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [EMPLOYEE, MANAGER, ADMINISTRATOR] }
    LeaveStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    DurationMode:
      type: string
      enum: [FULL_DAY, HALF_DAY_AM, HALF_DAY_PM]
    LeaveRequestInput:
      type: object
      additionalProperties: false
      required: [leaveTypeId, startDate, endDate, durationMode, reason]
      properties:
        leaveTypeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        durationMode: { $ref: '#/components/schemas/DurationMode' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    LeaveCalculation:
      type: object
      required: [chargeableDays, chargeableDates, tracksBalance, canSubmit]
      properties:
        chargeableDays: { type: number, multipleOf: 0.5, minimum: 0.5 }
        chargeableDates:
          type: array
          items: { type: string, format: date }
        excludedDates:
          type: array
          items: { $ref: '#/components/schemas/ExcludedDate' }
        tracksBalance: { type: boolean, description: When true, submission must validate and reserve sufficient available balance }
        availableDays: { type: number, multipleOf: 0.5 }
        canSubmit: { type: boolean }
        messages:
          type: array
          items: { type: string }
    ExcludedDate:
      type: object
      required: [date, reason]
      properties:
        date: { type: string, format: date }
        reason: { type: string, enum: [WEEKLY_OFF, HOLIDAY] }
    LeaveTypeSummary:
      type: object
      required: [id, code, name, tracksBalance, allowsHalfDay, cancellationCutoffDays]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        allowsHalfDay: { type: boolean }
        tracksBalance: { type: boolean }
        cancellationCutoffDays: { type: integer, minimum: 0 }
    LeaveBalance:
      type: object
      required: [id, leaveTypeId, leaveTypeName, periodStart, periodEnd, entitledDays, reservedDays, consumedDays, availableDays, version]
      properties:
        id: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        leaveTypeName: { type: string }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        entitledDays: { type: number, multipleOf: 0.5 }
        reservedDays: { type: number, multipleOf: 0.5 }
        consumedDays: { type: number, multipleOf: 0.5 }
        availableDays: { type: number, multipleOf: 0.5 }
        version: { type: integer, format: int64 }
    LeaveRequestSummary:
      type: object
      required: [id, employeeId, employeeName, leaveTypeId, leaveTypeName, startDate, endDate, durationMode, chargeableDays, status, submittedAt, version]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        leaveTypeId: { type: string, format: uuid }
        leaveTypeName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        durationMode: { $ref: '#/components/schemas/DurationMode' }
        chargeableDays: { type: number, multipleOf: 0.5 }
        status: { $ref: '#/components/schemas/LeaveStatus' }
        submittedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    LeaveRequestDetail:
      allOf:
        - $ref: '#/components/schemas/LeaveRequestSummary'
